<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageCap</title>
<meta name="description" content="Shrink images to fit a file size limit. Runs entirely in your browser.">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f6f7;
    --line: #e2e2e5;
    --text: #15161a;
    --dim: #6b6d76;
    --faint: #9a9ca4;
    --accent: #2f6df6;
    --accent-ink: #ffffff;
    --good: #18794e;
    --warn: #b4530a;
    --bad: #c0362c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --panel: #1e2024;
      --line: #2e3137;
      --text: #ecedf0;
      --dim: #a0a3ab;
      --faint: #70737b;
      --accent: #5b8dff;
      --accent-ink: #0c1326;
      --good: #4ac58a;
      --warn: #e0954a;
      --bad: #ef6f66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --panel: #1e2024; --line: #2e3137; --text: #ecedf0;
    --dim: #a0a3ab; --faint: #70737b; --accent: #5b8dff; --accent-ink: #0c1326;
    --good: #4ac58a; --warn: #e0954a; --bad: #ef6f66;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }

  header { margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .row + .row { margin-top: 14px; }
  .label { font-size: 12.5px; font-weight: 600; color: var(--dim); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  input[type=number], input[type=text] {
    font: inherit; font-size: 13px; padding: 6px 9px; width: 78px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--text);
  }
  label.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); }

  .btn {
    appearance: none; font: inherit; font-size: 14px; font-weight: 550;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 1px solid transparent;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }

  /* A working button stays at full opacity and spins, so a long batch reads as
     "busy" rather than "broken". Only honest because the encoding runs in
     workers — on the main thread this animation would freeze with everything else. */
  .btn.busy { opacity: 1; position: relative; padding-left: 36px; }
  .btn.busy::before {
    content: ""; position: absolute; left: 15px; top: 50%;
    width: 13px; height: 13px; margin-top: -7px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .btn.busy::before { animation-duration: 2.4s; }
  }

  #drop {
    border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 52px 20px; text-align: center; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  #drop h2 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
  #drop p { margin: 0; color: var(--dim); font-size: 13px; }
  #drop .formats { margin-top: 10px; font-size: 12px; color: var(--faint); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--faint); font-weight: 600; padding: 0 8px 8px; }
  td { padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .name { font-weight: 550; word-break: break-all; }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
          border: 1px solid currentColor; }
  .t-copied { color: var(--dim); }
  .t-ok { color: var(--good); }
  .t-resized { color: var(--warn); }
  .t-failed { color: var(--bad); }
  .saved { color: var(--good); }

  .notice {
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    background: color-mix(in srgb, var(--accent) 8%, var(--panel));
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
  }
  .notice h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .notice p { margin: 0 0 12px; font-size: 13px; color: var(--dim); }
  .notice .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .notice code {
    font-size: 12px; background: var(--bg); border: 1px solid var(--line);
    padding: 3px 7px; border-radius: 5px; user-select: all; word-break: break-all;
  }

  .bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }

  .summary { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13.5px; }

  /* On a phone the four columns cannot fit, so each result becomes a stacked
     block: filename, then status and the before/after figures on one line. */
  @media (max-width: 580px) {
    .wrap { padding: 24px 16px 48px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-top: 1px solid var(--line); padding: 10px 0 12px; }
    tr:first-child { border-top: 0; }
    td { border: 0; padding: 0; }
    td + td { margin-top: 5px; }
    td.num { display: inline-block; width: auto; margin: 5px 12px 0 0; text-align: left; }
    td.num .note { display: inline; margin-left: 5px; }
    .seg { width: 100%; }
    .seg button { flex: 1; }
    #drop { padding: 40px 16px; }
  }
  footer { margin-top: 28px; color: var(--faint); font-size: 12px; text-align: center; }
  a { color: var(--accent); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ImageCap</h1>
  </header>

  <div class="panel">
    <div class="row">
      <span class="label">Size limit</span>
      <div class="seg" id="presets"></div>
      <span style="color:var(--dim);font-size:13px">or</span>
      <input type="number" id="customMB" step="0.1" min="0.05" placeholder="MB" aria-label="Custom size limit in MB">
      <span style="color:var(--dim);font-size:13px">MB</span>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="limitDim"> Also limit longest edge to</label>
      <input type="number" id="dimPx" value="2400" min="64" step="100" disabled aria-label="Maximum pixel dimension">
      <span style="color:var(--dim);font-size:13px">px</span>
    </div>
  </div>

  <div id="drop" tabindex="0" role="button" aria-label="Add images">
    <h2>Drop images or a folder here</h2>
    <p>or click to choose files</p>
    <div class="formats">JPEG &middot; PNG &middot; WebP &middot; GIF &middot; AVIF &middot; HEIC</div>
  </div>
  <input type="file" id="picker" multiple accept="image/*,.heic,.heif" class="hide">

  <div class="notice hide" id="heicNotice">
    <h3 id="heicTitle"></h3>
    <p id="heicBody"></p>
    <div class="acts">
      <button class="btn" id="heicConvert">Convert them here</button>
      <button class="btn ghost" id="heicSafari">Open in Safari</button>
      <span id="heicCopy" class="hide" style="font-size:12.5px;color:var(--dim)">
        Didn't open? Paste this into Safari: <code id="heicUrl"></code>
      </span>
    </div>
  </div>

  <div class="panel hide" id="queuePanel">
    <div class="summary">
      <strong id="queueCount"></strong>
      <span style="flex:1"></span>
      <button class="btn ghost" id="clearBtn">Clear</button>
      <button class="btn" id="goBtn">Compress</button>
    </div>
    <div class="bar hide" id="progressWrap" style="margin-top:14px"><i id="progress"></i></div>
    <div id="progressText" class="note hide" style="margin-top:8px"></div>
  </div>

  <div class="panel hide" id="resultsPanel">
    <div class="summary" style="margin-bottom:14px">
      <strong id="totals"></strong>
      <span style="flex:1"></span>
      <button class="btn ghost" id="againBtn">Start over</button>
      <button class="btn" id="zipBtn">Download all</button>
    </div>
    <table>
      <thead><tr>
        <th>File</th><th style="width:1%">Result</th>
        <th class="num" style="width:1%">Before</th><th class="num" style="width:1%">After</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>Runs offline once loaded. Nothing is uploaded.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";

/* ---------------------------------------------------------------------------
   Settings

   The presets sit just under the round numbers these limits are quoted as.
   An upload cap of "2 MB" is a hard ceiling and platforms disagree about
   whether a megabyte is 1,000,000 or 1,048,576 bytes, so landing exactly on
   2 MB risks a rejected upload. The headroom costs nothing visible.
--------------------------------------------------------------------------- */
const PRESETS = [
  ["1.9 MB", 1_900_000],
  ["3.9 MB", 3_900_000],
  ["900 KB", 900_000],
  ["450 KB", 450_000],
];

const settings = {
  maxBytes: 1_900_000,
  maxDimension: null,
  // Quality we refuse to go below before shrinking dimensions instead. Past
  // roughly this point a smaller clean image reads better than a blurry
  // full-size one. The cap is met either way.
  minQuality: 0.40,
};

const SUPPORTED = /\.(jpe?g|png|gif|webp|avif|bmp|heic|heif|tiff?)$/i;
const isHeic = f => /\.(heic|heif)$/i.test(f.name);

/* ---------------------------------------------------------------------------
   Worker pool

   All the real work happens off the main thread. Canvas encoding is
   synchronous and heavy: on the main thread it blocks painting, so the page
   appears frozen and even a spinner stops turning. Running several workers
   also processes several images at once.

   Lanes are capped well below the core count on purpose. A 45-megapixel photo
   is roughly 180 MB once decoded to RGBA, and the searches hold more than one
   canvas at a time, so more lanes buys little and risks exhausting memory.
--------------------------------------------------------------------------- */
const LANES = Math.min(4, Math.max(1, Math.floor((navigator.hardwareConcurrency || 4) / 4)));

let pool = [];
let nextJobId = 0;
const pending = new Map();

function spawnPool(n = LANES) {
  if (pool.length) return;
  for (let i = 0; i < n; i++) {
    const w = new Worker("worker.js");
    w.onmessage = e => {
      const job = pending.get(e.data.id);
      if (!job) return;
      pending.delete(e.data.id);
      job.resolve(e.data);
      job.worker.busy = false;
    };
    w.busy = false;
    pool.push(w);
  }
}

function send(worker, payload) {
  const id = ++nextJobId;
  worker.busy = true;
  return new Promise(resolve => {
    pending.set(id, { resolve, worker });
    worker.postMessage({ ...payload, id });
  });
}

/* Run jobs across the pool, keeping every lane fed. onDone fires per result
   so progress reflects work actually finished, not work merely started. */
async function runPool(items, makePayload, onDone) {
  spawnPool();
  const out = new Array(items.length);
  let next = 0;

  await Promise.all(pool.map(async worker => {
    for (;;) {
      const i = next++;
      if (i >= items.length) return;
      const { result } = await send(worker, makePayload(items[i]));
      out[i] = result;
      onDone?.(result);
    }
  }));

  return out;
}

/* ---------------------------------------------------------------------------
   HEIC

   Safari decodes HEIC natively; Chrome and Firefox cannot, and iPhones shoot
   HEIC by default. Rather than failing, detect it quietly and offer two ways
   out: move to Safari, or pull in a WebAssembly decoder.

   The decoder is 1.3 MB and loads inside the workers only once a HEIC this
   browser genuinely cannot read turns up. Everyone else never fetches it.
--------------------------------------------------------------------------- */
let heicNative = null;     // null = untested
let heicConvert = false;   // user opted into the decoder

async function testHeicNative(file) {
  spawnPool();
  const worker = pool[0];
  const { native } = await send(worker, { kind: "heic-test", file });
  return native;
}

/* ---------------------------------------------------------------------------
   UI
--------------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const fmt = n => n >= 1_000_000 ? (n / 1_000_000).toFixed(1) + " MB"
               : n >= 1000 ? Math.round(n / 1000) + " KB" : n + " B";

let queue = [], results = [];

const segs = $("#presets");
PRESETS.forEach(([label, bytes]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.setAttribute("aria-pressed", bytes === settings.maxBytes);
  b.onclick = () => {
    settings.maxBytes = bytes;
    $("#customMB").value = "";
    [...segs.children].forEach(c => c.setAttribute("aria-pressed", c === b));
  };
  segs.appendChild(b);
});

$("#customMB").addEventListener("input", e => {
  const mb = parseFloat(e.target.value);
  if (mb > 0) {
    settings.maxBytes = Math.round(mb * 1_000_000);
    [...segs.children].forEach(c => c.setAttribute("aria-pressed", "false"));
  }
});

$("#limitDim").addEventListener("change", e => { $("#dimPx").disabled = !e.target.checked; syncDim(); });
$("#dimPx").addEventListener("input", syncDim);
function syncDim() {
  const px = parseInt($("#dimPx").value, 10);
  settings.maxDimension = $("#limitDim").checked && px > 0 ? px : null;
}

const drop = $("#drop");
drop.addEventListener("click", () => $("#picker").click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") $("#picker").click(); });
["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async e => add(await fromDrop(e.dataTransfer)));
$("#picker").addEventListener("change", e => add([...e.target.files].filter(f => SUPPORTED.test(f.name))));

async function walkEntry(entry, out) {
  if (entry.isFile) {
    const file = await new Promise(res => entry.file(res, () => res(null)));
    if (file && SUPPORTED.test(file.name)) out.push(file);
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise(res => reader.readEntries(res, () => res([])));
      if (!batch.length) break;
      for (const e of batch) await walkEntry(e, out);
    }
  }
}

async function fromDrop(dt) {
  const out = [];
  const entries = (dt.items ? [...dt.items] : []).map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) { for (const e of entries) await walkEntry(e, out); }
  else { for (const f of dt.files) if (SUPPORTED.test(f.name)) out.push(f); }
  return out;
}

function add(files) {
  if (!files.length) return;
  const seen = new Set(queue.map(f => f.name + f.size));
  for (const f of files) if (!seen.has(f.name + f.size)) queue.push(f);
  renderQueue();
  checkHeic();
}

function renderQueue() {
  const n = queue.length;
  $("#queuePanel").classList.toggle("hide", n === 0);
  $("#queueCount").textContent = `${n} image${n === 1 ? "" : "s"} ready`;
  $("#goBtn").disabled = n === 0;
}

/* Say nothing unless HEIC is actually a problem here. Safari never sees this. */
async function checkHeic() {
  const heics = queue.filter(isHeic);
  const notice = $("#heicNotice");
  if (!heics.length) { notice.classList.add("hide"); return; }

  if (heicNative === null) heicNative = await testHeicNative(heics[0]);
  if (heicNative || heicConvert) { notice.classList.add("hide"); return; }

  const n = heics.length;
  $("#heicTitle").textContent =
    `${n} HEIC photo${n === 1 ? "" : "s"} — this browser can't read ${n === 1 ? "it" : "them"}`;
  $("#heicBody").textContent =
    "HEIC is Apple's iPhone photo format, and only Safari opens it directly. " +
    "You can convert them here instead, which downloads a one-off 1.3 MB converter " +
    "and saves them as JPEG. Everything still stays on your device. Converting is " +
    "noticeably slower than Safari, so use Safari if it's handy.";
  notice.classList.remove("hide");
}

$("#heicConvert").onclick = () => {
  heicConvert = true;
  $("#heicNotice").classList.add("hide");
};

$("#heicSafari").onclick = () => {
  // macOS and iOS understand this scheme and hand the URL to Safari. If the
  // browser blocks it nothing happens, so show the URL as a fallback.
  $("#heicUrl").textContent = location.href;
  $("#heicCopy").classList.remove("hide");
  try { location.href = "x-safari-" + location.href; } catch {}
};

$("#clearBtn").onclick = () => { queue = []; renderQueue(); checkHeic(); };
$("#againBtn").onclick = () => {
  queue = []; results = [];
  renderQueue();
  checkHeic();
  $("#resultsPanel").classList.add("hide");
  $("#drop").classList.remove("hide");
};

$("#goBtn").onclick = async () => {
  const total = queue.length;
  const btn = $("#goBtn");
  results = [];
  let done = 0;

  btn.disabled = true;
  btn.classList.add("busy");
  $("#clearBtn").disabled = true;
  $("#progressWrap").classList.remove("hide");
  $("#progressText").classList.remove("hide");

  const tick = () => {
    done++;
    btn.textContent = `Compressing ${done} of ${total}…`;
    $("#progress").style.width = `${(done / total) * 100}%`;
    $("#progressText").textContent =
      `${done} of ${total} done${LANES > 1 ? ` — ${Math.min(LANES, total - done)} running at once` : ""}`;
  };

  btn.textContent = `Compressing 0 of ${total}…`;
  $("#progressText").textContent = `Starting ${Math.min(LANES, total)} at once…`;

  const t0 = performance.now();
  results = await runPool(
    queue,
    file => ({ kind: "process", file, settings, useDecoder: isHeic(file) && !heicNative && heicConvert }),
    tick
  );
  const secs = (performance.now() - t0) / 1000;

  btn.classList.remove("busy");
  btn.textContent = "Compress";
  btn.disabled = false;
  $("#clearBtn").disabled = false;
  $("#progressWrap").classList.add("hide");
  $("#progressText").classList.add("hide");
  $("#queuePanel").classList.add("hide");
  $("#drop").classList.add("hide");
  renderResults(secs);
};

const RANK = { failed: 0, converted: 1, resized: 2, ok: 3, copied: 4 };
const LABEL = {
  copied: "Already small enough", ok: "Compressed",
  resized: "Compressed + resized", converted: "Converted", failed: "Failed",
};

function renderResults(secs) {
  results.sort((a, b) => RANK[a.treatment] - RANK[b.treatment]);
  const tbody = $("#rows");
  tbody.innerHTML = "";

  for (const r of results) {
    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    const nm = document.createElement("div");
    nm.className = "name"; nm.textContent = r.name;
    td1.appendChild(nm);
    const bits = [];
    if (r.ow && r.meaningfullyResized) bits.push(`${r.ow}×${r.oh} → ${r.width}×${r.height}`);
    if (r.note) bits.push(r.note);
    if (bits.length) {
      const n = document.createElement("div");
      n.className = "note"; n.textContent = bits.join(" · ");
      td1.appendChild(n);
    }

    const td2 = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = "pill " + (r.treatment === "failed" ? "t-failed"
      : r.treatment === "resized" ? "t-resized"
      : r.treatment === "copied" ? "t-copied" : "t-ok");
    pill.textContent = LABEL[r.treatment];
    td2.appendChild(pill);

    const td3 = document.createElement("td");
    td3.className = "num"; td3.style.color = "var(--dim)";
    td3.textContent = fmt(r.before);

    const td4 = document.createElement("td");
    td4.className = "num";
    if (r.treatment === "failed") td4.textContent = "—";
    else {
      td4.innerHTML = `<strong>${fmt(r.after)}</strong>`;
      const pct = r.before > 0 ? 1 - r.after / r.before : 0;
      if (pct > 0.005) {
        const s = document.createElement("div");
        s.className = "note"; s.style.color = "var(--good)";
        s.textContent = `−${Math.round(pct * 100)}%`;
        td4.appendChild(s);
      }
    }

    tr.append(td1, td2, td3, td4);
    tbody.appendChild(tr);
  }

  const ok = results.filter(r => r.blob);
  const before = ok.reduce((s, r) => s + r.before, 0);
  const after = ok.reduce((s, r) => s + r.after, 0);
  const failed = results.filter(r => r.treatment === "failed").length;
  const pct = before > 0 ? Math.round((1 - after / before) * 100) : 0;

  $("#totals").innerHTML = `${fmt(before)} → ${fmt(after)}` +
    (pct > 0 ? ` <span class="saved">saved ${pct}%</span>` : "") +
    (failed ? ` <span style="color:var(--bad)">· ${failed} failed</span>` : "") +
    (secs ? ` <span style="color:var(--faint);font-weight:400">· ${secs.toFixed(1)}s</span>` : "");
  $("#zipBtn").disabled = ok.length === 0;
  $("#resultsPanel").classList.remove("hide");
}

$("#zipBtn").onclick = async () => {
  const btn = $("#zipBtn");
  btn.disabled = true;
  btn.classList.add("busy");
  btn.textContent = "Zipping…";
  const zip = new JSZip();
  const used = new Set();
  for (const r of results) {
    if (!r.blob) continue;
    let name = r.name, n = 2;
    while (used.has(name)) { name = r.name.replace(/(\.[^.]+)$/, `-${n}$1`); n++; }
    used.add(name);
    zip.file(name, r.blob);
  }
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Compressed ${fmt(settings.maxBytes)}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  btn.classList.remove("busy");
  btn.disabled = false;
  btn.textContent = "Download all";
};
</script>
</body>
</html>
